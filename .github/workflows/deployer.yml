# Déploiement automatique sur le serveur EC2, après chaque fusion sur main dont les tests sont verts.
#
# Passe par AWS Systems Manager (SSM) : aucun port SSH à ouvrir sur Internet. GitHub demande à AWS d'exécuter
# scripts/deployer-ec2.sh sur le serveur, puis affiche son compte rendu ici.
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  clés d'un utilisateur IAM limité à SSM (voir docs/deploiement-ec2.md)
#   AWS_REGION                                région du serveur, ex. eu-west-3
#   EC2_INSTANCE_ID                           identifiant du serveur, ex. i-0abc123…
name: Déployer

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploiement-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    name: Déployer sur EC2
    # Seulement si les tests de la fusion sur main ont réussi (ou lancement manuel depuis l'onglet Actions).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Accès AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Lancer le déploiement sur le serveur
        id: envoi
        env:
          INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # Toujours la dernière version du script (lue dans origin/main), exécutée en tant que ec2-user.
          commande='sudo -iu ec2-user bash -c "git -C /home/ec2-user/ikan fetch --quiet origin main && git -C /home/ec2-user/ikan show origin/main:scripts/deployer-ec2.sh > /tmp/deployer-ec2.sh && bash /tmp/deployer-ec2.sh"'
          jq -n --arg c "$commande" '{commands: [$c], executionTimeout: ["1500"]}' > parametres.json
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "IKAN AI ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters file://parametres.json \
            --query Command.CommandId --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Attendre le résultat et afficher le compte rendu
        env:
          INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
          ID: ${{ steps.envoi.outputs.id }}
        run: |
          for _ in $(seq 1 180); do
            etat=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$etat" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text
          erreurs=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query StandardErrorContent --output text)
          [ -z "$erreurs" ] || { echo "---- erreurs"; echo "$erreurs"; }
          echo "État : $etat"
          [ "$etat" = "Success" ]
