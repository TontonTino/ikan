# Tests automatiques : à chaque PR et à chaque fusion sur main, toutes les parties de l'app sont vérifiées.
# Une PR dont un test échoue est signalée en rouge sur GitHub avant d'être fusionnée.
# Aucun secret n'est utilisé ici : les tests tournent sur des bases de test jetables (SQLite en mémoire, PostgreSQL du runner).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard (tests, types, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/dashboard/package-lock.json }
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        env:
          VITE_API_URL: https://api.exemple.test/api/v1
          VITE_CLIENT_URL: https://client.exemple.test
          VITE_AGENT_URL: https://agent.exemple.test
        run: npx vite build

  client:
    name: Formulaire client (tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/client/package-lock.json }  # node --test avec motif « *.test.mjs » : Node 21+
      - run: npm ci
      - run: npm test
      - name: Build
        env: { PUBLIC_API_URL: https://api.exemple.test/api/v1 }
        run: npm run build

  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    env:
      APP_ENV: development
      SECRET_KEY: ci-cle-de-test-sans-valeur-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/api/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -p no:cacheprovider

  agent:
    name: YAM (pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/agent } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: ikanai_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      SECRET_KEY: ci-cle-de-test-sans-valeur-0123456789abcdef0123456789
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ikanai_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ikanai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/agent/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -p no:cacheprovider tests_unit tests

  veille:
    name: Veille (pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/veille } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: apps/veille/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -p no:cacheprovider
