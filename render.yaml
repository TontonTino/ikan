databases:
  - name: ikanai-db
    databaseName: ikanai
    user: ikanai_user
    plan: free

services:
  - type: web
    name: ikanai-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    # Migrations exécutées automatiquement à chaque déploiement (aligné sur
    # ikanai-agent) — évite qu'un déploiement de code en avance sur une migration
    # non appliquée manuellement casse la prod (voir incident du 23/09/2026 :
    # login en 500 après un push ajoutant des colonnes jamais migrées en base).
    # Sûr uniquement parce que les migrations de ce repo restent strictement
    # additives (sa.inspect avant chaque add_column, jamais de colonne supprimée/
    # renommée) — le `&&` empêche uvicorn de démarrer si la migration échoue,
    # donc Render garde l'ancienne instance en vie plutôt que de basculer sur un
    # état incohérent.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ikanai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_CLIENT_URL
        value: https://ikan-1.onrender.com
      - key: PUBLIC_DASHBOARD_URL
        value: https://ikanai-dashboard-fixs.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://ikan-1.onrender.com,https://ikanai-dashboard-fixs.onrender.com
      # Facturation Stripe : clés sk_test_.../pk_test_... tant que le mode test est actif.
      # Basculer en production = remplacer ces deux valeurs par des clés sk_live_/pk_live_,
      # aucun autre changement (code ou base) n'est nécessaire.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Signing secret du endpoint webhook (Stripe Dashboard > Webhooks, une fois
      # https://ikan-772d.onrender.com/webhooks/stripe enregistré côté Stripe).
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Alertes de quota par email (Brevo SMTP relay — smtp-relay.brevo.com:587).
      # MAIL_USERNAME = login SMTP Brevo (page SMTP du compte, PAS l'email de contact
      # forcément), MAIL_PASSWORD = clé SMTP (commence par xsmtpsib-...).
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: noreply@ikanai.app
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SERVER
        value: smtp-relay.brevo.com
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_SSL_TLS
        value: "false"

  # Agent IA « YAM » (FastAPI, apps/agent). Se connecte à la MÊME base PostgreSQL
  # qu'ikanai-api et vérifie les JWT émis par ikanai-api (même SECRET_KEY).
  # Les variables `sync: false` n'ont AUCUNE valeur dans ce fichier : à saisir
  # dans le dashboard Render, jamais dans git.
  - type: web
    name: ikanai-agent
    runtime: python
    rootDir: apps/agent
    buildCommand: pip install -r requirements.txt
    # Les migrations (tables actions_agent, conversations, conversation_turns) sont
    # idempotentes et suivies dans leur propre table alembic_version_agent
    # (indépendante de celle d'ikanai-api). Le plan free n'a pas de preDeployCommand.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # groq/compound-mini décommissionné par Groq le 21/09/2026. Modèles de
      # génération de texte encore accessibles au plan gratuit à cette date :
      # openai/gpt-oss-20b et openai/gpt-oss-120b (Llama 3.1/3.3 passés en
      # Enterprise uniquement). 20b retenu : suffisant, le LLM ne fait que
      # rédiger à partir de données déjà extraites (voir app/agent/qa_service.py),
      # aucun raisonnement complexe requis.
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # MÊME valeur que la base d'ikanai-api (lecture des feedbacks, écriture des tables de l'agent).
      - key: DATABASE_URL
        sync: false
      # IDENTIQUE à SECRET_KEY d'ikanai-api : l'agent vérifie ses JWT, il n'en émet jamais.
      # Ne pas utiliser generateValue (les deux services divergeraient).
      - key: SECRET_KEY
        sync: false
      # Clé Groq : https://console.groq.com/keys
      - key: GROQ_API_KEY
        sync: false
      # Secret partagé du webhook ; IDENTIQUE à WEBHOOK_SECRET d'ikanai-api.
      - key: WEBHOOK_SECRET
        sync: false
      # Origines autorisées à appeler l'agent depuis le navigateur (ex. l'URL du dashboard).
      - key: ALLOWED_ORIGINS
        sync: false
      # Optionnel (envoi WhatsApp) : WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID,
      # WHATSAPP_TEMPLATE_NAME, WHATSAPP_TEMPLATE_LANG — à ajouter dans le dashboard si besoin.

  - type: web
    name: ikanai-client
    runtime: node
    rootDir: apps/client
    buildCommand: npm install && npm run build
    startCommand: node ./dist/server/entry.mjs
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_API_URL
        value: https://ikan-772d.onrender.com/api/v1

  - type: static
    name: ikanai-dashboard
    rootDir: apps/dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - apps/dashboard/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ikan-772d.onrender.com/api/v1
      - key: VITE_CLIENT_URL
        value: https://ikan-1.onrender.com
      - key: VITE_AGENT_URL
        value: https://yam-tpip.onrender.com
