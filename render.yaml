databases:
  - name: ikanai-db
    databaseName: ikanai
    user: ikanai_user
    plan: free

services:
  - type: web
    name: ikanai-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ikanai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_CLIENT_URL
        value: https://ikanai-client.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://ikanai-client.onrender.com,https://ikanai-dashboard.onrender.com

  - type: web
    name: ikanai-client
    runtime: node
    rootDir: apps/client
    buildCommand: npm install && npm run build
    startCommand: node ./dist/server/entry.mjs
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_API_URL
        value: https://ikan-772d.onrender.com/api/v1

  - type: static
    name: ikanai-dashboard
    rootDir: apps/dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - apps/dashboard/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ikan-772d.onrender.com/api/v1
      - key: VITE_CLIENT_URL
        value: https://ikan-1.onrender.com
