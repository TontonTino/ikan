# demo.ikanai.bf — démonstration publique (docs/demo-publique.md). Copier dans /etc/nginx/conf.d/ikan-demo.conf.
# Une seule adresse pour tout : le dashboard, l'API sous /api/ et YAM sous /yam/. Même origine = cookies de session sans détour.
# Le certificat HTTPS est ajouté ensuite par certbot (sudo certbot --nginx -d demo.ikanai.bf), qui complète ce fichier.
server {
    listen 80;
    server_name demo.ikanai.bf;

    root /var/www/ikan-demo-dashboard;
    index index.html;

    # Un visiteur ne doit pas être indexé comme la vraie application.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    location /yam/ {
        proxy_pass http://127.0.0.1:8101/;      # le « / » final retire le préfixe /yam
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                 # une réponse de YAM peut prendre quelques secondes
        proxy_buffering off;
    }

    # Application monopage : toute autre adresse renvoie index.html.
    location / {
        try_files $uri /index.html;
    }
}
